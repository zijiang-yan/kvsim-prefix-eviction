# E5: prefill cost regime (.inf = position-independent cost).
name: e5_cost
kv_bytes_per_token: 131072
l0: 26700
warmup_frac: 0.1
seeds: [0, 1, 2, 3, 4]
workload:
  n_requests: 50000
  n_docs: 10000
  docs_per_request: 3
  zipf_alpha: 0.9
  shift_every: 0
sweep:
  budget_frac: [0.05, 0.1]
  l0: [.inf, 26700, 8000, 4000]
policies:
  - {name: lru}
  - {name: leaf_lru}
  - {name: leaf_lru, lookahead: 4, label: leaf_lru_la}
  - {name: lfu}
  - {name: leaf_lfu}
  - {name: pgdsf}
  - {name: ours, decay: 0.001}
  - {name: ours, decay: 0.001, cost: tokens, label: ours_tokencost}
  - {name: ours, decay: 0.0, label: ours_nodecay}
  - {name: ours_nodep, decay: 0.001}
