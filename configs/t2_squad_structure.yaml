# T2: SQuAD trace, prompt structure (docs per request x reordering), article order.
name: t2_squad_structure
kv_bytes_per_token: 131072
l0: 26700
warmup_frac: 0.1
seeds: [0, 1, 2]
workload:
  trace: traces/squad_train.json.gz
  docs_per_request: 3
  order: article
sweep:
  budget_frac: [0.05]
  workload.docs_per_request: [1, 3, 5]
  workload.sort_docs: [false, true]
policies:
  - {name: lru}
  - {name: leaf_lru}
  - {name: leaf_lru, lookahead: 4, label: leaf_lru_la}
  - {name: lfu}
  - {name: leaf_lfu}
  - {name: pgdsf}
  - {name: ours, decay: 0.0001}
  - {name: ours, decay: 0.0001, cost: tokens, label: ours_tokencost}
  - {name: ours, decay: 0.0, label: ours_nodecay}
  - {name: ours_nodep, decay: 0.0001}
