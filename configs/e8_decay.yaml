# E8: decay rate scaled to the trace (token cost), stationary and shifting popularity.
name: e8_decay
kv_bytes_per_token: 131072
l0: 26700
warmup_frac: 0.1
seeds: [0, 1, 2, 3, 4]
workload:
  n_requests: 50000
  n_docs: 10000
  docs_per_request: 3
  zipf_alpha: 0.9
  shift_every: 0
sweep:
  budget_frac: [0.1]
  workload.shift_every: [0, 2000, 500]
policies:
  - {name: lru}
  - {name: lfu}
  - {name: ours, decay: 0.0, cost: tokens, label: ours_tok_l0}
  - {name: ours, decay: 0.00001, cost: tokens, label: ours_tok_l1e-5}
  - {name: ours, decay: 0.00003, cost: tokens, label: ours_tok_l3e-5}
  - {name: ours, decay: 0.0001, cost: tokens, label: ours_tok_l1e-4}
  - {name: ours, decay: 0.0003, cost: tokens, label: ours_tok_l3e-4}
