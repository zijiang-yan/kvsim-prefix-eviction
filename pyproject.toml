[project]
name = "kvsim"
version = "0.1.0"
description = "Trace-driven simulator for prefix-aware KV-cache eviction in RAG serving"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
plot = ["pandas>=2.1", "matplotlib>=3.8"]
trace = ["scikit-learn>=1.4"]

[project.scripts]
kvsim = "kvsim.run:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kvsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
